services:
  backend-dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    init: true
    working_dir: /workspace/backend
    volumes:
      - ..:/workspace:cached
      - gradle-cache:/home/vscode/.gradle
    command: sleep infinity
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/app_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_AUTH: false
      SPRING_MAIL_STARTTLS: false
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ZGV2Y29udGFpbmVyLWxvY2FsLW9ubHktand0LWtleS0zMi1ieXRlcw==}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  gradle-cache:
